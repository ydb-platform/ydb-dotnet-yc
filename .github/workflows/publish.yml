name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x 
      - name: Build
        run: |
          cd src
          dotnet build --configuration Release 
          dotnet pack -c Release -o out /p:Version=$VERSION
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: robot-ydb-platform
      - name: Publish
        env:
          NUGET_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push src/out/Ydb.Sdk.Yc.Auth.$VERSION.nupkg --skip-duplicate --api-key "$NUGET_TOKEN" --source https://api.nuget.org/v3/index.json
